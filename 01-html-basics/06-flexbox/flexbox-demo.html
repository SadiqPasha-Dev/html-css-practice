<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Profile Card</title>
        <style>
            body {
                background-color: #f0f2f5;
                font-family: Arial, sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }
               .profile-card {
                background-color: white;
                width: 300px;
                height: 340px;
                padding: 30px;
                border-radius: 12px;
                box-shadow: 0  8px 12px rgba(0,0,0,0.1);
                text-align: center;
            }
            .profile-card h2 {
                margin: 0 0 5px;
                color: #1a3a5c;
            }
            .avatar {
                width: 80px;
                height: 80px;
                background-color: #1a3a5c;
                color: white;
                font-size: 28px;
                font-weight: bold;
                border-radius: 50%;
                display: flex;
                justify-content: center;
                align-items: center;
                margin: 0 auto 15px;
            }
            .role {
                color: gray;
                font-size: 14px;
                margin: 0 0 15px;
            }
            .bio {
                color: #333;
                font-size: 14px;
                line-height: 1.5;
                margin-bottom: 20px;
            }
            .stats {
                display: flex;
                justify-content: space-around;
                border-top: 1px solid #ddd;
                border-bottom: 1px solid #ddd;
                padding: 15px 0;
                margin-bottom: 20px;
            }
            .stat {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .number {
                font-size: 20px;
                font-weight: bold;
                color: #1a3a5c;
            }
            .label {
                font-size: 12px;
                color: gray;
            }
            .btn {
                display: inline-block;
                background-color: #1a3a5c;
                color: white;
                padding: 10px 25px;
                text-decoration: none;
                border-radius: 5px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="profile-card">
            <div class="avatar">SP</div>
            <h2>Sadiq Pasha</h2>
            <p class="role">Web Developer in Training</p>
            <p class="bio">Learning HTML, CSS, and design - one drill at a time.</p> 
            <div class="stats">
                <div class="stat">
                    <span class="number">7</span>
                    <span class="label">CSS Topics</span>
                </div>
                <div class="stat">
                    <span class="number">3</span>
                    <span class="label">Builds</span>
                </div>
                <div class="stat">
                    <span class="number">1</span>
                    <span class="label">Live Site</span>
                </div>
            </div>
            <a href="#contact" class="btn">Contact Me</a>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Landing Page</title>
        <style>
            body {
                background-color: #f4f4f4;
                font-family: Arial, sans-serif;
                margin: 0;
            }
            .navbar {
                display: flex;
                justify-content: space-between;
                align-items: center;
                background-color: #222;
                padding: 15px 30px;
            }
            .logo {
                color: white;
                font-size: 24px;
                font-weight: bold;
            }
            .nav-links {
                display: flex;
                gap: 20px;
            }
            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: bold;
            }
            .hero {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                height: 300px;
                background-color: navy;
                color: white;
                text-align: center;
            }
            .hero h1 {
                font-size: 36px;
                margin-bottom: 10px;
            }
            .hero p {
                font-size: 18px;
                margin-bottom: 20px;
            }
            .btn {
                background-color: #ff6600;
                color: white;
                padding: 10px 25px;
                text-decoration: none;
                font-weight: bold;
                border-radius: 5px;
            }
            .features {
                display: flex;
                gap: 20px;
                padding: 30px;
            }
            .feature-card {
                flex: 1;
                background-color: white;
                padding: 20px;
                border: 2px solid #ddd;
                border-radius: 8px;
                text-align: center;
            }
            .feature-card h2 {
                color: navy;
                margin-bottom: 10px; 
            }
            .footer {
                display: flex;
                justify-content: center;
                background-color: #222;
                color: white;
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <header>
            <nav class="navbar">
                <span class="logo">MyBrand</span>
                <div class="nav-links">
                    <a href="#home">Home</a>
                    <a href="#features">Features</a>
                    <a href="#contact">Contact</a>
                </div>
            </nav>
        </header>
        <main>
            <section class="hero">
                <h1>Welcome to MyBrand</h1>
                <p>Building beautiful things with flexbox.</p>
                <a href="#features" class="btn">Get Started</a>
            </section>
            <section class="features">
                <div class="feature-card">
                    <h2>Fast</h2>
                    <p>Lightning-quick performance.</p>
                </div>
                <div class="feature-card">
                    <h2>Simple</h2>
                    <p>Easy to use and understand.</p>
                </div>
                <div class="feature-card">
                    <h2>Responsive</h2>
                    <p>Looks great on every device.</p>
                </div>
            </section>
        </main>
        <footer class="footer">
            <p>&copy; 2026 MyBrand</p>
        </footer>
    </body>
</html>
